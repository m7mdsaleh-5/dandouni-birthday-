justify-content:center;

font-family:Arial;
overflow:hidden;
text-align:center;
}

#gift{
font-size:100px;
cursor:pointer;
animation:b 1.5s infinite;
}

@keyframes b{

}

.card{
display:none;
background:white;
padding:30px;
border-radius:30px;
width:80%;
max-width:500px;
box-shadow:0 0 40px #ff69b4;
}

h1{
color:#ff3f91;
font-size:45px;
}

p{
font-size:19px;
line-height:1.8;
color:#555;
}

.heart{
position:absolute;
font-size:30px;
animation:f 6s infinite;
}

@keyframes f{
from{top:100vh}
to{top:-10vh}
}

</style>
</head>


<body>

<div id="start">
<div id="gift" onclick="openGift()">🎁</div>
